<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Background Hexagon/Polygon with Glow -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="url(#glow-grad)" stroke="url(#brand-grad)" stroke-width="3" />
  
  <!-- Stylized 'W' monogram -->
  <path d="M 28 32 L 38 68 L 50 46 L 62 68 L 72 32" stroke="url(#brand-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="46" r="4" fill="#34d399" />
</svg>
